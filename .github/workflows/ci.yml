name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:
  linux-build:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v4
    - run: git fetch --prune --unshallow
    - name: install dependencies
      run: |
        sudo apt update
        sudo apt install libsdl3-dev libxxhash-dev libcglm-dev libfdk-aac-dev
    - name: build
      run: make -j$(nproc) USER=1
    - name: create appimage
      run: |
        sudo apt install libfuse2
        ./.github/linux-appimage.sh
    - uses: actions/upload-artifact@v4
      with:
        name: Tanuki3DS-linux-binary
        path: ./build/ctremu
    - uses: actions/upload-artifact@v4
      with:
        name: Tanuki3DS-linux-appimage
        path: ./Tanuki3DS-x86_64.AppImage

  linux-arm-build:
    runs-on: ubuntu-26.04-arm
    steps:
    - uses: actions/checkout@v4
    - run: git fetch --prune --unshallow
    - name: install dependencies
      run: |
        sudo apt update
        sudo apt install libsdl3-dev libxxhash-dev libcglm-dev libfdk-aac-dev
    - name: build
      run: make -j$(nproc) USER=1
    - name: create appimage
      run: |
        sudo apt install libfuse2
        ./.github/linux-appimage.sh
    - uses: actions/upload-artifact@v4
      with:
        name: Tanuki3DS-linux-arm-binary
        path: ./build/ctremu
    - uses: actions/upload-artifact@v4
      with:
        name: Tanuki3DS-linux-arm-appimage
        path: ./Tanuki3DS-aarch64.AppImage
        
  macos-x86-build:
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v4
    - run: git fetch --prune --unshallow
    - name: install dependencies
      run: |
        brew update
        brew install coreutils sdl3 xxhash cglm fdk-aac
    - name: build
      run: make -j$(nproc) USER=1

    # taken from panda3ds
    - name: create app bundle
      run: |
        brew install dylibbundler imagemagick
        ./.github/mac-bundle.sh
        codesign --force -s - -vvvv Tanuki3DS.app
        zip -r Tanuki3DS-macos-x86_64 Tanuki3DS.app

    - uses: actions/upload-artifact@v4
      with:
        name: Tanuki3DS-macos-x86_64
        path: ./Tanuki3DS-macos-x86_64.zip

  macos-arm-build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - run: git fetch --prune --unshallow
    - name: install dependencies
      run: |
        brew update
        brew install coreutils sdl3 xxhash cglm fdk-aac
    - name: build
      run: make -j$(nproc) USER=1

    # taken from panda3ds
    - name: create app bundle
      run: |
        brew install dylibbundler imagemagick
        ./.github/mac-bundle.sh
        codesign --force -s - -vvvv Tanuki3DS.app
        zip -r Tanuki3DS-macos-arm64 Tanuki3DS.app

    - uses: actions/upload-artifact@v4
      with:
        name: Tanuki3DS-macos-arm64
        path: ./Tanuki3DS-macos-arm64.zip

  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@v2
      with:
          msystem: CLANG64
    - uses: actions/checkout@v4
    - run: |
        pacman --noconfirm -S git  
        git fetch --prune --unshallow
    - name: install dependencies
      run: |
        pacman -Sy
        pacman --noconfirm -S make \
        mingw-w64-clang-x86_64-{clang,sdl3,xxhash,cglm,fdk-aac}
    - name: build
      run: make -j$(nproc) USER=1
    - name: add icon
      run: |
        pacman --noconfirm -S mingw-w64-clang-x86_64-imagemagick
        convert images/logo.png logo.ico
        wget https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
        ./rcedit-x64 ./build/ctremu.exe --set-icon logo.ico
    - uses: actions/upload-artifact@v4
      with:
        name: Tanuki3DS-windows
        path: ./build/ctremu.exe
  windows-arm-build:
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@v2
      with:
          msystem: CLANGARM64
    - uses: actions/checkout@v4
    - run: |
        pacman --noconfirm -S git  
        git fetch --prune --unshallow
    - name: install dependencies
      run: |
        pacman -Sy
        pacman --noconfirm -S make \
        mingw-w64-clang-aarch64-{clang,sdl3,xxhash,cglm,fdk-aac}
    - name: build
      run: make -j$(nproc) USER=1
    - name: add icon
      run: |
        pacman --noconfirm -S mingw-w64-clang-aarch64-imagemagick
        convert images/logo.png logo.ico
        wget https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
        ./rcedit-x64 ./build/ctremu.exe --set-icon logo.ico
    - uses: actions/upload-artifact@v4
      with:
        name: Tanuki3DS-windows-arm
        path: ./build/ctremu.exe
